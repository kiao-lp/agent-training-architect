[mcp_servers.duckduckgo]
command = "uvx"
args = ["--from", "duckduckgo-mcp-server==0.7.0", "duckduckgo-mcp-server"]

[mcp_servers.duckduckgo.env]

[mcp_servers.fetch]
command = "uvx"
args = ["--from", "mcp-server-fetch==2026.11.18", "mcp-server-fetch"]

[mcp_servers.fetch.env]

[mcp_servers.kiao-files]
command = "kiao-mcp-files"
args = []

[mcp_servers.kiao-files.env]

[mcp_servers.markitdown]
command = "uvx"
args = ["--with", "azure-ai-contentunderstanding>=1.2.0b1", "--from", "markitdown-mcp==0.0.1a8", "markitdown-mcp"]

[mcp_servers.markitdown.env]

[mcp_servers.papers]
command = "uvx"
args = ["--with", "mcp<2", "--from", "paper-search-mcp==0.1.4", "paper-search-mcp"]

[mcp_servers.papers.env]

[mcp_servers.playwright]
command = "npx"
args = ["--yes", "@playwright/mcp@0.0.86", "--headless", "--isolated", "--browser", "chromium"]

[mcp_servers.playwright.env]

[mcp_servers.kiao-units]
command = "kiao-mcp-units"
args = []

[mcp_servers.kiao-units.env]

[mcp_servers.kiao-hybridflow]
command = "kiao-mcp-hybridflow"
args = []

[mcp_servers.kiao-hybridflow.env]
