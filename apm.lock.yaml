    - duckduckgo-mcp-server
    registry: false
    command: uvx
  fetch:
    name: fetch
    transport: stdio
    args:
    - --from
    - mcp-server-fetch==2026.11.18
    - mcp-server-fetch
    registry: false
    command: uvx
  kiao-files:
